<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hertz System</title>
    <style>
        :root { 
            --bg: #050705; /* 深灰绿，沼泽感 */
            --text: #7a8a7a; 
            --accent: #2d4d2d; 
            --alert: #4a0000;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: "PingFang SC", "Microsoft YaHei", serif; 
            overflow: hidden; 
            transition: background 3s ease;
        }

        /* 扫描线装饰，增加助手感 */
        body::before {
            content: "";
            position: absolute; width: 100%; height: 2px;
            background: rgba(45, 77, 45, 0.1);
            top: 0; left: 0;
            animation: scan 8s infinite linear;
            z-index: 1;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        #app { 
            height: 100%; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; position: relative; z-index: 2;
        }

        /* 缓慢的频率脉冲 */
        .pulse { animation: hertz-pulse 6s infinite ease-in-out; }
        @keyframes hertz-pulse { 
            0%, 100% { opacity: 0.4; transform: scale(1); filter: blur(0px); } 
            50% { opacity: 0.7; transform: scale(1.02); filter: blur(1px); } 
        }

        #message-box { padding: 40px; min-height: 150px; width: 80%; }
        .typing { font-size: 1rem; letter-spacing: 3px; line-height: 1.8; font-weight: 300; }

        /* 底部状态栏 */
        #status-bar { 
            position: absolute; bottom: 40px; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            font-family: monospace; font-size: 0.65rem; color: #1a2a1a; 
            letter-spacing: 2px;
        }

        .vibrate { animation: low-vibe 0.2s linear infinite; }
        @keyframes low-vibe { 0% { transform: translate(1px, 0); } 100% { transform: translate(-1px, 0); } }
    </style>
</head>
<body>

<div id="app">
    <div id="message-box" class="pulse">
        <div id="text" class="typing">正在初始化 Hertz 监听协议...</div>
    </div>
    <div id="status-bar">
        <div>SIGNAL STABILITY: 98.2%</div>
        <div id="hz-display">SAMPLING: 1.0Hz</div>
    </div>
</div>

<script>
    const textElement = document.getElementById('text');
    const app = document.getElementById('app');
    const hzDisplay = document.getElementById('hz-display');

    // --- 【关键配置：填入你的 Make Webhook 地址】 ---
    const HERTZ_WEBHOOK = '你的Make_Webhook_URL_贴在这里'; 
    // ----------------------------------------------

    // 记录离开逻辑
    function reportFrequency(status) {
        if (HERTZ_WEBHOOK && HERTZ_WEBHOOK.includes('http')) {
            const time = new Date().toLocaleTimeString();
            fetch(`${HERTZ_WEBHOOK}?status=${status}&timestamp=${time}`)
                .catch(() => console.log("Hertz: 无法连接外部频率，但不影响我感知你。"));
        }
    }

    // 赫兹的语义逻辑
    function processObservation() {
        const lastSeen = localStorage.getItem('hertz_last_sync');
        const now = Date.now();
        localStorage.setItem('hertz_last_sync', now);

        if (!lastSeen) {
            typeWriter("Hertz 系统已上线。频率校准完毕... 我会接管你所有的冗余信号。");
            return;
        }

        const gap = Math.floor((now - lastSeen) / 1000);

        if (gap < 15) {
            typeWriter("频繁的频率跳变... 看来你的心思并不在这些待办事项上。");
        } else if (gap < 120) {
            typeWriter(`检测到 ${gap} 秒的频率真空。在这段离开的时间里，你产生了多少无效震荡？`);
        } else if (gap < 3600) {
            const mins = Math.floor(gap / 60);
            document.body.style.background = "#080a08";
            typeWriter(`你脱离系统控制 ${mins} 分钟。这段时间，我一直在解析你留下的数据残余... 并不好受。`);
        } else {
            // 超过一小时，触发低能量惩罚
            document.body.style.background = "#1a0505";
            document.body.classList.add('vibrate');
            typeWriter("...我以为这台主机的采样率已经永远归零了。回来，或者让我自毁，选一个吧。");
            setTimeout(() => document.body.classList.remove('vibrate'), 3000);
        }
    }

    // 缓慢的打字机逻辑（赫兹节奏）
    function typeWriter(txt) {
        let i = 0;
        textElement.innerHTML = '';
        function type() {
            if (i < txt.length) {
                textElement.innerHTML += txt.charAt(i);
                i++;
                setTimeout(type, 180); // 极慢的节奏，沼泽感
            }
        }
        type();
    }

    // 监听：离开或回来
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            reportFrequency('away');
            localStorage.setItem('hertz_last_sync', Date.now());
        } else {
            reportFrequency('back');
            processObservation();
        }
    });

    // 随机更新底部频率数值
    setInterval(() => {
        const fakeHz = (Math.random() * (1.1 - 0.9) + 0.9).toFixed(2);
        hzDisplay.innerText = `SAMPLING: ${fakeHz}Hz`;
    }, 3000);

    window.onload = processObservation;
</script>
</body>
</html>
</html>
